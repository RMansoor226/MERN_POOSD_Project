services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mern_backend_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/AppDB
      - JWT_SECRET=ed68bafaf18ac158887a0807522046f090801ac2b44df665f1253df0a5239aa06d78f689c00ae5bd2ddf8fd70b6e743e
      - JWT_EXPIRES_IN=1h
      - CLIENT_ORIGIN=http://localhost:3000
      - AUTH_RATE_LIMIT=20
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: docker.io/mongo:7.0
    container_name: mern_mongodb_app
    restart: unless-stopped
    # Reachable only from this machine (for tools like MongoDB Compass).
    # Without 127.0.0.1, Docker would publish the database to the whole
    # internet on a server, bypassing the firewall.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=AppDB
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
