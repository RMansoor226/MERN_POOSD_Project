info:
  name: Error - Cast Error
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseURL}}/api/users/not-an-object-id"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 with a string error", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.be.a("string");
        });
        test("does not expose Mongoose internals", function () {
          const text = JSON.stringify(res.getBody());
          expect(text).to.not.include("Cast to ObjectId");
          expect(text).to.not.include("stack");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: A malformed id must produce a clean 400, never a 500.