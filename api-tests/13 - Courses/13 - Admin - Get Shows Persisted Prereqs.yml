info:
  name: Admin - Get Shows Persisted Prereqs
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseURL}}/api/courses/{{courseId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("Mixed path change was saved (markModified)", function () {
          expect(res.getBody().prereqs.op).to.equal("AND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Guards against forgetting markModified on the Mixed prereqs field.
