info:
  name: Error - Update Course Requires Itself
  type: http
  seq: 34

http:
  method: PATCH
  url: "{{baseURL}}/api/courses/{{courseId}}"
  body:
    type: json
    data: |-
      {
        "prereqs": {
          "courseId": "{{courseId}}"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("prereqs");
        });
        test("details.prereqs explains the failure", function () {
          expect(res.getBody().details["prereqs"]).to.equal("a course cannot require itself");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
