info:
  name: Admin - Clear Prereqs
  type: http
  seq: 15

http:
  method: PATCH
  url: "{{baseURL}}/api/courses/{{courseId}}"
  body:
    type: json
    data: |-
      {
        "prereqs": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("prereqs is null", function () {
          expect(res.getBody().prereqs).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
