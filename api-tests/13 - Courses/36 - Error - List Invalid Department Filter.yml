info:
  name: Error - List Invalid Department Filter
  type: http
  seq: 36

http:
  method: GET
  url: "{{baseURL}}/api/courses?departmentId=abc"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("departmentId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
