info:
  name: Error - Create Negative Credits
  type: http
  seq: 24

http:
  method: POST
  url: "{{baseURL}}/api/courses"
  body:
    type: json
    data: |-
      {
        "subject": "tst",
        "number": "{{runId}}8",
        "title": "Test Course {{runId}}",
        "credits": -1,
        "description": "Created by the API tests",
        "departmentId": "{{deptCsId}}",
        "attributes": [
          "GenEd-Test"
        ],
        "prereqs": {
          "op": "OR",
          "items": [
            {
              "courseId": "{{courseCop3502Id}}",
              "minGrade": "C"
            },
            {
              "courseId": "{{courseMac2311Id}}",
              "concurrentOk": true
            }
          ]
        },
        "coreqs": [],
        "prereqText": "Test standing"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("credits");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
