info:
  name: Admin - Update Course Details
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseURL}}/api/courses/{{courseId}}"
  body:
    type: json
    data: |-
      {
        "title": "Renamed Course {{runId}}",
        "credits": 4
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("fields changed", function () {
          expect(res.getBody().title).to.equal("Renamed Course " + bru.getVar("runId"));
          expect(res.getBody().credits).to.equal(4);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
