info:
  name: Student - Cannot Create Course
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseURL}}/api/courses"
  body:
    type: json
    data: |-
      {}
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "Bearer " + bru.getVar("studentToken"));
    - type: tests
      code: |-
        test("responds 403 Insufficient permissions", function () {
          expect(res.getStatus()).to.equal(403);
          expect(res.getBody().error).to.equal("Insufficient permissions");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The role check runs before body validation, so an empty body still yields 403.
