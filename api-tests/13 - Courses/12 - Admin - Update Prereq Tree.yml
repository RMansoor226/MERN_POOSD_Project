info:
  name: Admin - Update Prereq Tree
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{baseURL}}/api/courses/{{courseId}}"
  body:
    type: json
    data: |-
      {
        "prereqs": {
          "op": "AND",
          "items": [
            {
              "courseId": "{{courseCop3502Id}}",
              "minGrade": "B"
            }
          ]
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("tree replaced", function () {
          expect(res.getBody().prereqs.op).to.equal("AND");
          expect(res.getBody().prereqs.items[0].minGrade).to.equal("B");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
