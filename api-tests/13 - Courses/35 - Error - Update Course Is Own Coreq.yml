info:
  name: Error - Update Course Is Own Coreq
  type: http
  seq: 35

http:
  method: PATCH
  url: "{{baseURL}}/api/courses/{{courseId}}"
  body:
    type: json
    data: |-
      {
        "coreqs": [
          "{{courseId}}"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("coreqs");
        });
        test("details.coreqs explains the failure", function () {
          expect(res.getBody().details["coreqs"]).to.equal("a course cannot be its own corequisite");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
