info:
  name: Admin - List Search Escapes Regex
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/api/courses?q=.*"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("treats the query as literal text", function () {
          expect(res.getBody().items).to.have.length(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `.*` must not be interpreted as a regular expression.
