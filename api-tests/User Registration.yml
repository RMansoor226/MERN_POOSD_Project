info:
  name: User Registration
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/api/user/register"
  body:
    type: json
    data: |-
      {
        firstName: "John",
        lastName: "Wick",
        login: "{{newLogin}}",
        password: "{{newPassword}}",
        email: "johnwickmode@gmail.com",
        role: "advisor",
        declarations: []
      }
  auth: inherit

runtime:
  variables:
    - name: newLogin
      value: babaYaga
    - name: newPassword
      value: consequences

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
