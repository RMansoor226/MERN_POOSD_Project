http:
  method: GET
  url: "{{baseURL}}/api/terms/{{termId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns the record", function () {
          expect(res.getBody()._id).to.equal(bru.getVar("termId"));
        });

settings:
