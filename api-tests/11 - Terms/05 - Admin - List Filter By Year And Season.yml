info:
  name: Admin - List Filter By Year And Season
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/api/terms?year=2040&season=summer"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("every result matches the filters", function () {
          const items = res.getBody().items;
          expect(items.length).to.be.at.least(1);
          items.forEach((x) => { expect(x.year).to.equal(2040); expect(x.season).to.equal("summer"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
