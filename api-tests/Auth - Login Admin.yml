info:
  name: Auth - Login Admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/auth/login"
  body:
    type: json
    data: |-
      { "login": "admin1", "password": "ucf123!" }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("adminToken", res.getBody().token);
    - type: tests
      code: |-
        test("returns a JWT and the admin role", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().token).to.be.a("string");
          expect(res.getBody().token.split(".")).to.have.length(3);
          expect(res.getBody().role).to.equal("admin");
        });