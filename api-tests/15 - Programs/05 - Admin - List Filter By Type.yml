info:
  name: Admin - List Filter By Type
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/api/programs?type=minor"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("every result is a minor", function () {
          const items = res.getBody().items;
          expect(items.length).to.be.at.least(1);
          items.forEach((x) => expect(x.type).to.equal("minor"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
