info:
  name: Student - Cannot Delete Program
  type: http
  seq: 15

http:
  method: DELETE
  url: "{{baseURL}}/api/programs/{{programId}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "Bearer " + bru.getVar("studentToken"));
    - type: tests
      code: |-
        test("responds 403 Insufficient permissions", function () {
          expect(res.getStatus()).to.equal(403);
          expect(res.getBody().error).to.equal("Insufficient permissions");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
