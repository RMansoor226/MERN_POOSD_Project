info:
  name: Error - Create Unknown Requirement Course
  type: http
  seq: 25

http:
  method: POST
  url: "{{baseURL}}/api/programs"
  body:
    type: json
    data: |-
      {
        "name": "Ghost Course {{runId}}",
        "type": "minor",
        "degree": "MINOR",
        "departmentId": "{{deptMatId}}",
        "catalogYear": 2026,
        "totalCredits": 18,
        "requirements": [
          {
            "name": "X",
            "rule": "all",
            "courseIds": [
              "000000000000000000000001"
            ]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("requirements");
        });
        test("details.requirements explains the failure", function () {
          expect(res.getBody().details["requirements"]).to.equal("references a course that does not exist");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
