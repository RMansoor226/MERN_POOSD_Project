info:
  name: Admin - Create Program
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/programs"
  body:
    type: json
    data: |-
      {
        "name": "Test Program {{runId}}",
        "type": "minor",
        "degree": "MINOR",
        "departmentId": "{{deptMatId}}",
        "catalogYear": 2026,
        "totalCredits": 18,
        "requirements": [
          {
            "name": "Core",
            "rule": "all",
            "courseIds": [
              "{{courseMac2311Id}}"
            ]
          },
          {
            "name": "Electives",
            "rule": "anyN",
            "n": 2,
            "filter": {
              "subject": "mac",
              "minLevel": 3000
            }
          },
          {
            "name": "Credits",
            "rule": "minCredits",
            "credits": 6,
            "filter": {
              "attribute": "GenEd-Math"
            }
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("programId", res.getBody()._id);
    - type: tests
      code: |-
        test("responds 201", function () {
          expect(res.getStatus()).to.equal(201);
        });
        test("returns the new record with an _id", function () {
          expect(res.getBody()._id).to.be.a("string");
        });
        test("fields round-trip", function () {
          const b = res.getBody();
          expect(b.type).to.equal("minor");
          expect(b.catalogYear).to.equal(2026);
          expect(b.departmentId).to.equal(bru.getVar("deptMatId"));
        });
        test("requirements are nested with their rules", function () {
          const r = res.getBody().requirements;
          expect(r).to.have.length(3);
          expect(r[0].rule).to.equal("all");
          expect(r[1].n).to.equal(2);
          expect(r[1].filter.subject).to.equal("MAC");
          expect(r[2].credits).to.equal(6);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
