info:
  name: Admin - Update Program
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseURL}}/api/programs/{{programId}}"
  body:
    type: json
    data: |-
      {
        "name": "Renamed Program {{runId}}",
        "totalCredits": 21
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("fields changed, requirements kept", function () {
          expect(res.getBody().name).to.equal("Renamed Program " + bru.getVar("runId"));
          expect(res.getBody().totalCredits).to.equal(21);
          expect(res.getBody().requirements).to.have.length(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
