info:
  name: Error - Create Duplicate Program
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseURL}}/api/programs"
  body:
    type: json
    data: |-
      {
        "name": "Test Program {{runId}}",
        "type": "minor",
        "degree": "MINOR",
        "departmentId": "{{deptMatId}}",
        "catalogYear": 2026,
        "totalCredits": 18,
        "requirements": [
          {
            "name": "Core",
            "rule": "all",
            "courseIds": [
              "{{courseMac2311Id}}"
            ]
          },
          {
            "name": "Electives",
            "rule": "anyN",
            "n": 2,
            "filter": {
              "subject": "mac",
              "minLevel": 3000
            }
          },
          {
            "name": "Credits",
            "rule": "minCredits",
            "credits": 6,
            "filter": {
              "attribute": "GenEd-Math"
            }
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 409", function () {
          expect(res.getStatus()).to.equal(409);
        });
        test("does not expose Mongo internals", function () {
          const text = JSON.stringify(res.getBody());
          expect(text).to.not.include("E11000");
          expect(text).to.not.include("keyPattern");
          expect(text).to.not.include("stack");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Unique on type + name + catalogYear.
