info:
  name: Login
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseURL}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "login": "{{username}}",
        "password": "{{userPassword}}"
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: babaYaga
    - name: userPassword
      value: consequences

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
