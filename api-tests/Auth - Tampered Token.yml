info:
  name: Auth - Tampered Token
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseURL}}/api/users/{{seedUserId}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        const [h, p, s] = bru.getVar("studentToken").split(".");
        const flipped = (s[0] === "A" ? "B" : "A") + s.slice(1);   // corrupts the signature
        req.setHeader("Authorization", "Bearer " + [h, p, flipped].join("."));
    - type: tests
      code: |-
        test("responds 401 Invalid or expired token", function () {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().error).to.equal("Invalid or expired token");
        });