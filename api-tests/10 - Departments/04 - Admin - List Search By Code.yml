info:
  name: Admin - List Search By Code
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/api/departments?q=T{{runId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("finds exactly the created department", function () {
          expect(res.getBody().items).to.have.length(1);
          expect(res.getBody().items[0]._id).to.equal(bru.getVar("deptId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
