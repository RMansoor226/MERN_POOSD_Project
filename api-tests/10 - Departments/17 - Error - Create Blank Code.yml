info:
  name: Error - Create Blank Code
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseURL}}/api/departments"
  body:
    type: json
    data: |-
      {
        "code": "   ",
        "name": "Blank"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("code");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Whitespace is trimmed, so a blank code fails the min length rule.
