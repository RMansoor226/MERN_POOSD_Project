info:
  name: Error - Update Only Unknown Field
  type: http
  seq: 21

http:
  method: PATCH
  url: "{{baseURL}}/api/departments/{{deptId}}"
  body:
    type: json
    data: |-
      {
        "role": "admin",
        "bogus": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("_");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Unknown keys are stripped by zod, leaving nothing to update.
