info:
  name: Param - Twelve Character String
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseURL}}/api/users/aaaaaaaaaaaa"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects a 12-char string that Mongoose would cast", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Invalid id format");
        });