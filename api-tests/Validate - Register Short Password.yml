info:
  name: Validate - Register Short Password
  type: http
  seq: 25

http:
  method: POST
  url: "{{baseURL}}/api/auth/register"
  body:
    type: json
    data: |-
      { "login": "ab", "password": "short" }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 with per-field details", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
          expect(res.getBody().details).to.have.property("login");
          expect(res.getBody().details).to.have.property("password");
        });