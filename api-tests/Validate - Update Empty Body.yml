info:
  name: Validate - Update Empty Body
  type: http
  seq: 29

http:
  method: PATCH
  url: "{{baseURL}}/api/users/{{seedUserId}}"
  body:
    type: json
    data: |-
      { "role": "admin" }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("a body with only stripped fields is rejected", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
          expect(res.getBody().details).to.have.property("_");
        });