info:
  name: Admin - Withdraws A Student
  type: http
  seq: 27

http:
  method: PATCH
  url: "{{baseURL}}/api/enrollments/{{enrStudentEnrollmentId}}"
  body:
    type: json
    data: |-
      {
        "status": "withdrawn"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("withdrawn", function () {
          expect(res.getBody().status).to.equal("withdrawn");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
