info:
  name: Admin - Section Counts After Promotion
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseURL}}/api/sections/{{enrSectionId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("one seat taken, waitlist empty", function () {
          expect(res.getBody().enrolledCount).to.equal(1);
          expect(res.getBody().waitlistCount).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
