info:
  name: Student - Cannot List Other Student
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseURL}}/api/enrollments?studentId={{otherStudentId}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "Bearer " + bru.getVar("studentToken"));
    - type: tests
      code: |-
        test("responds 403", function () {
          expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
