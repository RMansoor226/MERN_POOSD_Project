info:
  name: Instructor - Reads Roster
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseURL}}/api/enrollments?sectionId={{enrSectionId}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "Bearer " + bru.getVar("instructorToken"));
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("both students, with names", function () {
          const items = res.getBody().items;
          expect(res.getBody().total).to.equal(2);
          items.forEach((e) => expect(e.studentId.login).to.be.a("string"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
