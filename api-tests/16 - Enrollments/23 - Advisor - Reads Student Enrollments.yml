info:
  name: Advisor - Reads Student Enrollments
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseURL}}/api/enrollments?studentId={{seedUserId}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "Bearer " + bru.getVar("advisorToken"));
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns that student's records", function () {
          res.getBody().items.forEach((e) => expect(e.studentId._id).to.equal(bru.getVar("seedUserId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
