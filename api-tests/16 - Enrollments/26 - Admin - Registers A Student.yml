info:
  name: Admin - Registers A Student
  type: http
  seq: 26

http:
  method: POST
  url: "{{baseURL}}/api/enrollments"
  body:
    type: json
    data: |-
      {
        "sectionId": "{{enrSectionId}}",
        "studentId": "{{seedUserId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 201", function () {
          expect(res.getStatus()).to.equal(201);
        });
        test("re-uses the dropped record and waitlists (the seat is still held by the completed student)", function () {
          expect(res.getBody()._id).to.equal(bru.getVar("enrStudentEnrollmentId"));
          expect(res.getBody().status).to.equal("waitlisted");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
