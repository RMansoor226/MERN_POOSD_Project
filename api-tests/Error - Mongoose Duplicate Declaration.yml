info:
  name: Error - Mongoose Duplicate Declaration
  type: http
  seq: 30

http:
  method: PATCH
  url: "{{baseURL}}/api/users/{{seedUserId}}"
  body:
    type: json
    data: |-
      {
        "declarations": [
          { "programId": "000000000000000000000001", "catalogYear": 2025 },
          { "programId": "000000000000000000000001", "catalogYear": 2025 }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("passes zod, fails the model's pre-validate hook", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
          expect(res.getBody().details.declarations).to.equal("the same program cannot be declared twice");
        });