info:
  name: Validate - Login Operator Injection
  type: http
  seq: 27

http:
  method: POST
  url: "{{baseURL}}/api/auth/login"
  body:
    type: json
    data: |-
      { "login": { "$ne": null }, "password": "anything" }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects an object in place of a string", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().details).to.have.property("login");
          expect(res.getBody()).to.not.have.property("token");
        });