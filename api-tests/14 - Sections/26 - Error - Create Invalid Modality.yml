info:
  name: Error - Create Invalid Modality
  type: http
  seq: 26

http:
  method: POST
  url: "{{baseURL}}/api/sections"
  body:
    type: json
    data: |-
      {
        "courseId": "{{courseCop3502Id}}",
        "termId": "{{termFutureId}}",
        "sectionNumber": "E6{{runId}}",
        "crn": "E6{{runId}}",
        "instructorIds": [
          "{{instructorAedoId}}"
        ],
        "meetings": [
          {
            "days": [
              "T",
              "R"
            ],
            "startMinute": 600,
            "endMinute": 675,
            "building": "HEC",
            "room": "200"
          }
        ],
        "modality": "zoom",
        "capacity": 30,
        "waitlistCapacity": 5,
        "enrolledCount": 25,
        "waitlistCount": 4
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("modality");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
