info:
  name: Admin - List Filter By Status
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/api/sections?status=open"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("every result is open", function () {
          res.getBody().items.forEach((s) => expect(s.status).to.equal("open"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
