info:
  name: Error - Update Empty Body
  type: http
  seq: 34

http:
  method: PATCH
  url: "{{baseURL}}/api/sections/{{sectionId}}"
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("_");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
