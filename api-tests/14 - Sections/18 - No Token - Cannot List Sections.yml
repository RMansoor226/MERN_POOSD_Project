info:
  name: No Token - Cannot List Sections
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseURL}}/api/sections"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 401 Authentication required", function () {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().error).to.equal("Authentication required");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
