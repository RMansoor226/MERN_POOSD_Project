info:
  name: Student - Can Read One Section
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseURL}}/api/sections/{{sectionId}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "Bearer " + bru.getVar("studentToken"));
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns the record", function () {
          expect(res.getBody()._id).to.equal(bru.getVar("sectionId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
