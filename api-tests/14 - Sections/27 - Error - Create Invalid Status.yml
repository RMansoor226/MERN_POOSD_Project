info:
  name: Error - Create Invalid Status
  type: http
  seq: 27

http:
  method: POST
  url: "{{baseURL}}/api/sections"
  body:
    type: json
    data: |-
      {
        "courseId": "{{courseCop3502Id}}",
        "termId": "{{termFutureId}}",
        "sectionNumber": "E7{{runId}}",
        "crn": "E7{{runId}}",
        "instructorIds": [
          "{{instructorAedoId}}"
        ],
        "meetings": [
          {
            "days": [
              "T",
              "R"
            ],
            "startMinute": 600,
            "endMinute": 675,
            "building": "HEC",
            "room": "200"
          }
        ],
        "modality": "hybrid",
        "capacity": 30,
        "waitlistCapacity": 5,
        "enrolledCount": 25,
        "waitlistCount": 4,
        "status": "archived"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("status");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
