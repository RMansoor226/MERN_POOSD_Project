info:
  name: Error - Get Not Found
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseURL}}/api/sections/000000000000000000000000"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 404 Section not found with that ID", function () {
          expect(res.getStatus()).to.equal(404);
          expect(res.getBody().error).to.equal("Section not found with that ID");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
