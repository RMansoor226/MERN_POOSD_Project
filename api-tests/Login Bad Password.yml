info:
  name: Login Bad Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseURL}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "login": "metoo",
        "password": "wrongpassword"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 401 with an error message", function () {
          expect(res.getStatus()).to.equal(401);
          expect(res.getBody().id).to.equal(-1);
          expect(res.getBody().error).to.equal("Login/Password incorrect");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Failed login: correct username, incorrect password."
