info:
  name: Role - Admin Lists Users
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseURL}}/api/users"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200 with an array", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.be.an("array");
          expect(res.getBody().length).to.be.greaterThan(0);
        });
        test("never exposes password hashes", function () {
          res.getBody().forEach((u) => expect(u).to.not.have.property("password"));
        });