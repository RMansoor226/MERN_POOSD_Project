info:
  name: Role - Student Reads Own Record
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseURL}}/api/users/{{seedUserId}}"
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Authorization", "Bearer " + bru.getVar("studentToken"));
    - type: tests
      code: |-
        test("responds 200 with the caller's own record", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()._id).to.equal(bru.getVar("seedUserId"));
        });