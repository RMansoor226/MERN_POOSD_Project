info:
  name: Admin - List Instructors
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/api/instructors"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("returns the paged envelope", function () {
          const b = res.getBody();
          expect(b.items).to.be.an("array");
          expect(b.total).to.be.a("number");
          expect(b.page).to.equal(1);
          expect(b.limit).to.equal(25);
        });
        test("includes seeded and created instructors", function () {
          expect(res.getBody().total).to.be.at.least(4);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
