info:
  name: Error - Update Unknown Department
  type: http
  seq: 19

http:
  method: PATCH
  url: "{{baseURL}}/api/instructors/{{instructorId}}"
  body:
    type: json
    data: |-
      {
        "departmentId": "000000000000000000000001"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds 400 Validation Failed", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().error).to.equal("Validation Failed");
        });
        test("details name the failing field(s)", function () {
          const d = res.getBody().details;
          expect(d).to.be.an("object");
          expect(d).to.have.property("departmentId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
